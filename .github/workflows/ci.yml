name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  js-ci:
    name: JS/TS — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version is pinned in .node-version (single source of truth
          # across CI, setup.sh, and package.json engines fields).
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all TypeScript packages
        run: pnpm typecheck

      - name: Run JS/TS tests
        run: pnpm test

      - name: Build all packages
        run: pnpm build

  lint:
    name: Lint TypeScript Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node version is pinned in .node-version (single source of truth
          # across CI, setup.sh, and package.json engines fields).
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  # gitleaks action now requires a paid license for organizations.
  # Disabled until a license is configured or replaced with an alternative.
  # secret-scan:
  #   name: Secret Scanning (gitleaks)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #
  #     - name: Run gitleaks secret scanner
  #       uses: gitleaks/gitleaks-action@v2.3.4
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Intentionally separate from integration.yml, which requires Docker and stellar-cli.

    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Build contract wasm
        run: |
          cargo build --target wasm32v1-none --release -p linkora-contracts
          cp target/wasm32v1-none/release/linkora_contracts.wasm contracts/linkora-contracts/linkora_contracts.wasm

      - name: Run unit tests
        run: cargo test

      - name: Run fuzz / invariant property tests
        run: |
          cargo test -p linkora-contracts --test fuzz_social_graph
          cargo test -p linkora-contracts --test invariant_social_graph
          cargo test -p linkora-contracts --test fuzz_tip
          cargo test -p linkora-contracts --test fuzz_credential
          cargo test -p linkora-contracts --test fuzz_governance
          cargo test -p linkora-contracts --test fuzz_oracle
