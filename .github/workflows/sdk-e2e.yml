name: SDK E2E Tests

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      contract_id:
        description: 'Contract ID to test against (optional)'
        required: false
        type: string

jobs:
  sdk-e2e:
    name: SDK E2E Tests (Testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node version is pinned in .node-version (single source of truth
          # across CI, setup.sh, and package.json engines fields).
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve contract ID
        id: contract
        env:
          INPUT_CONTRACT_ID: ${{ github.event.inputs.contract_id }}
          VAR_CONTRACT_ID: ${{ vars.TESTNET_CONTRACT_ID }}
        run: |
          CONTRACT_ID="${INPUT_CONTRACT_ID:-$VAR_CONTRACT_ID}"
          if [[ -z "$CONTRACT_ID" ]]; then
            echo "::error::No contract ID available. Pass workflow_dispatch input 'contract_id' or set the 'TESTNET_CONTRACT_ID' repository variable (Settings > Secrets and variables > Actions > Variables) to the currently deployed testnet contract." >&2
            exit 1
          fi
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

      - name: Run SDK E2E tests
        working-directory: packages/sdk
        env:
          TESTNET_SECRET_KEY: ${{ secrets.TESTNET_SECRET_KEY }}
          LINKORA_CONTRACT_ID: ${{ steps.contract.outputs.contract_id }}
        run: pnpm test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-e2e-results
          path: packages/sdk/coverage/
          retention-days: 7