openapi: "3.1.0"
info:
  title: Linkora Indexer API
  version: "0.1.0"
  license:
    name: MIT
    url: https://opensource.org/license/mit/
  description: |
    REST API for querying indexed on-chain data from the Linkora protocol.

    Paths are absolute against the service root (the first server below), so
    `/api/profiles/{address}` is served at `http://localhost:3001/api/profiles/{address}`.

    Every REST API route mounted by `createApp()` in `src/api/index.ts` is
    documented here. The development-only `/api/docs` and `/api/openapi.yaml`
    helper routes are excluded. The unit test
    `src/api/__tests__/openapi.test.ts` walks the mounted Express routes and
    fails when a REST route has no OpenAPI entry (or an OpenAPI entry has no
    route), so the two cannot drift apart.

    ## Authentication

    Operations declaring `security: StellarSig` require the `Authorization`
    header described under `components.securitySchemes.StellarSig`. Other
    endpoints are public (some are still subject to rate limiting).
    Public API reads accept an optional `StellarSig` header;
    `optionalStellarAuth` then populates the caller's address so the rate
    limiter can select the per-address bucket.

servers:
  - url: http://localhost:3001
    description: Local development server (service root)

security: []

tags:
  - name: Health
    description: Liveness, readiness and startup probes plus Prometheus metrics.
  - name: Profiles
    description: Indexed profile lookups.
  - name: Posts
    description: Post lookups, reports, and media uploads.
  - name: Feed
    description: Home, explore, and following feeds.
  - name: Search
    description: Full-text post search.
  - name: Follows
    description: Follower and following lists.
  - name: Pools
    description: Tip pool details and analytics.
  - name: Governance
    description: Indexed governance proposals.
  - name: Events
    description: Raw on-chain contract events with cursor pagination.
  - name: Users
    description: User block lists and published direct-message keys.
  - name: Notifications
    description: Device registration, preferences, and notification inbox.
  - name: State Root
    description: Computed ledger state-root records.
  - name: Messages
    description: Direct-message submission.

paths:
  # ── Health / metrics (mounted outside /api) ─────────────────────────────────
  /health:
    get:
      summary: Aggregated health report
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        "200":
          description: Instance is ready (may be `degraded`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, down]
                  uptime:
                    type: integer
                  version:
                    type: string
                  commit:
                    type: string
                  checks:
                    type: object
                    additionalProperties: true
                  rateLimiter:
                    type: object
                    additionalProperties: true
                  backfill:
                    type: object
                    additionalProperties: true
        "503":
          description: Instance is not ready; excluded from the load balancer.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health/live:
    get:
      summary: Liveness probe
      operationId: getHealthLive
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [alive]
                  uptime:
                    type: integer

  /health/ready:
    get:
      summary: Readiness probe
      operationId: getHealthReady
      tags: [Health]
      security: []
      responses:
        "200":
          description: Database, Stellar RPC and event stream are healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready, not_ready]
                  degraded:
                    type: boolean
                  checks:
                    type: object
                    additionalProperties: true
        "503":
          description: One or more dependencies are unhealthy (or no monitor is configured).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health/startup:
    get:
      summary: Startup probe
      operationId: getHealthStartup
      tags: [Health]
      security: []
      responses:
        "200":
          description: Initial bootstrap has completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [started]
                  startedAt:
                    type: string
                    format: date-time
        "503":
          description: Bootstrap is still in progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [starting]

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      tags: [Health]
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  # ── Profiles ────────────────────────────────────────────────────────────────
  /api/profiles/search:
    get:
      summary: Search profiles by username or address
      operationId: searchProfiles
      tags: [Search, Profiles]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Case-insensitive username or Stellar address fragment.
        - $ref: "#/components/parameters/limit"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching profiles to skip.
      responses:
        "200":
          description: Matching profiles ordered by exact match, prefix match, then follower count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/profiles:
    get:
      summary: List profiles
      operationId: listProfiles
      tags: [Profiles]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Cursor-paginated list of profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileList"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/profiles/{address}:
    get:
      summary: Get profile by address
      operationId: getProfile
      tags: [Profiles]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Posts ───────────────────────────────────────────────────────────────────
  /api/posts:
    get:
      summary: List posts
      operationId: listPosts
      tags: [Posts]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: author
          in: query
          required: false
          schema:
            type: string
          description: Filter posts by author Stellar address.
        - name: deleted
          in: query
          required: false
          schema:
            type: boolean
          description: Include deleted posts when true.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Paginated list of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/posts/{id}:
    get:
      summary: Get post by ID
      operationId: getPost
      tags: [Posts]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/posts/{id}/reports:
    get:
      summary: List reports filed against a post
      operationId: listPostReports
      tags: [Posts]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/postId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Paginated list of reports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/posts/media/config:
    get:
      summary: Media upload configuration
      operationId: getMediaConfig
      tags: [Posts]
      security:
        - StellarSig: []
        - {}
      responses:
        "200":
          description: Upload limits accepted by this instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_upload_bytes:
                    type: integer
                  allowed_image_types:
                    type: array
                    items:
                      type: string

  /api/posts/media:
    post:
      summary: Upload post media
      operationId: uploadPostMedia
      tags: [Posts]
      security:
        - StellarSig: []
      description: Requires a valid `StellarSig` header (write endpoint).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Media stored; returns the served URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Upload exceeds `max_upload_bytes`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Feed ────────────────────────────────────────────────────────────────────
  /api/feed:
    get:
      summary: Home feed
      operationId: getFeed
      tags: [Feed]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: viewer
          in: query
          required: false
          schema:
            type: string
          description: Stellar address whose follow graph shapes the feed.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: >-
            Offset-based fallback for the home feed (legacy). The explore and
            following feeds use cursor pagination; the home feed will migrate
            in a follow-up once the social graph query is refactored.
      responses:
        "200":
          description: Paginated feed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/feed/explore:
    get:
      summary: Explore feed
      operationId: getExploreFeed
      tags: [Feed]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated explore feed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/feed/following/{address}:
    get:
      summary: Following feed
      operationId: getFollowingFeed
      tags: [Feed]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated feed of accounts the address follows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  # ── Search ──────────────────────────────────────────────────────────────────
  /api/search/posts:
    get:
      summary: Search posts
      operationId: searchPosts
      tags: [Search]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Full-text search query.
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Matching posts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/search:
    get:
      summary: Search across posts, profiles, and pools
      operationId: search
      tags: [Search]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Full-text search query.
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [posts, profiles, pools]
          description: Filter by result type.
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Matching results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"


  # ── Webhooks ────────────────────────────────────────────────────────────────
  /api/webhooks:
    post:
      summary: Register a webhook endpoint
      operationId: registerWebhook
      tags: [Webhooks]
      security:
        - StellarSig: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, secret, event_types]
              properties:
                url:
                  type: string
                  format: uri
                secret:
                  type: string
                event_types:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/webhooks/{id}:
    delete:
      summary: Deactivate a webhook
      operationId: deleteWebhook
      tags: [Webhooks]
      security:
        - StellarSig: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Webhook deactivated
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/webhooks/{id}/deliveries:
    get:
      summary: List webhook delivery attempts
      operationId: getWebhookDeliveries
      tags: [Webhooks]
      security:
        - StellarSig: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Delivery history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ── Events ──────────────────────────────────────────────────────────────────
  /api/events/replay:
    get:
      summary: Replay historical events
      operationId: replayEvents
      tags: [Events]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: fromLedger
          in: query
          required: true
          schema:
            type: integer
        - name: toLedger
          in: query
          required: true
          schema:
            type: integer
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: NDJSON stream of events
          content:
            application/x-ndjson:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  # ── Follows ─────────────────────────────────────────────────────────────────
  /api/follows/{address}/followers:
    get:
      summary: Get followers of an address
      operationId: getFollowers
      tags: [Follows]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Paginated list of followers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowerList"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/follows/{address}/following:
    get:
      summary: Get accounts followed by an address
      operationId: getFollowing
      tags: [Follows]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Paginated list of following
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowingList"
        "400":
          $ref: "#/components/responses/ValidationError"

  # ── Pools ───────────────────────────────────────────────────────────────────
  /api/pools:
    get:
      summary: List pools
      operationId: listPools
      tags: [Pools]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Cursor-paginated list of tip pools.
          content:
            application/json:
              schema:
                type: object
                required: [pools, limit, cursor, next_cursor, has_more]
                properties:
                  pools:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pool"
                  limit:
                    type: integer
                  cursor:
                    type: [string, "null"]
                  next_cursor:
                    type: [string, "null"]
                    description: Pass as `cursor` to fetch the next page. `null` when no more pages.
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/pools/search:
    get:
      summary: Search tip pools by pool ID or token
      operationId: searchPools
      tags: [Search, Pools]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Case-insensitive pool ID or token fragment.
        - $ref: "#/components/parameters/limit"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching pools to skip.
      responses:
        "200":
          description: Matching pools ordered by exact pool ID match, then balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pools:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pool"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/pools/{id}:
    get:
      summary: Get pool by ID
      operationId: getPool
      tags: [Pools]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/poolId"
      responses:
        "200":
          description: Pool found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/pools/{id}/analytics:
    get:
      summary: Pool analytics
      operationId: getPoolAnalytics
      tags: [Pools]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/poolId"
      responses:
        "200":
          description: Aggregated pool statistics.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Governance ──────────────────────────────────────────────────────────────
  /api/governance/proposals:
    get:
      summary: List governance proposals
      operationId: listProposals
      tags: [Governance]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Cursor-paginated proposals.
          content:
            application/json:
              schema:
                type: object
                required: [proposals, limit, cursor, next_cursor, has_more]
                properties:
                  proposals:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  limit:
                    type: integer
                  cursor:
                    type: [string, "null"]
                  next_cursor:
                    type: [string, "null"]
                    description: Pass as `cursor` to fetch the next page. `null` when no more pages.
                  has_more:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"

  # ── Events ──────────────────────────────────────────────────────────────────
  /api/events:
    get:
      summary: List on-chain events
      operationId: listEvents
      tags: [Events]
      security:
        - StellarSig: []
        - {}
      description: >-
        Returns a cursor-paginated list of raw on-chain events from `raw_events`,
        sorted newest-first by `(ledger_sequence DESC, event_index DESC)`.
        The composite keyset cursor guarantees no skipped or duplicated rows
        when new events are ingested between page requests.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
        - name: contract_id
          in: query
          required: false
          schema:
            type: string
          description: Filter events to a single contract address.
        - name: topic
          in: query
          required: false
          schema:
            type: string
          description: Filter by first topic value (exact match against `topic[1]`).
      responses:
        "200":
          description: Cursor-paginated list of on-chain events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Users ───────────────────────────────────────────────────────────────────
  /api/users/{address}/blocked:
    get:
      summary: List accounts blocked by an address
      operationId: getBlocked
      tags: [Users]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Paginated block list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/users/{address}/dm-key:
    get:
      summary: Get the published X25519 DM key for an address
      operationId: getDmKey
      tags: [Users]
      security:
        - StellarSig: []
        - {}
      parameters:
        - $ref: "#/components/parameters/address"
      responses:
        "200":
          description: Published key (hex).
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                  x25519_pubkey:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Notifications ───────────────────────────────────────────────────────────
  /api/notifications/register:
    post:
      summary: Register a device push token
      operationId: registerDevice
      tags: [Notifications]
      security:
        - StellarSig: []
      description: Requires a valid `StellarSig` header (write endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, token, platform]
              properties:
                address:
                  type: string
                  description: Must match the signer address.
                token:
                  type: string
                platform:
                  type: string
                  enum: [ios, android, web]
      responses:
        "204":
          description: Token registered.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/notifications/deregister:
    post:
      summary: Remove a device push token
      operationId: deregisterDevice
      tags: [Notifications]
      security:
        - StellarSig: []
      description: Requires a valid `StellarSig` header (write endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, token]
              properties:
                address:
                  type: string
                  description: Must match the signer address.
                token:
                  type: string
      responses:
        "204":
          description: Token removed.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/notifications/preferences:
    get:
      summary: Get notification preferences
      operationId: getNotificationPreferences
      tags: [Notifications]
      security:
        - StellarSig: []
      description: Requires a valid `StellarSig` header (the caller's own preferences).
      responses:
        "200":
          description: Current preferences.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Update notification preferences
      operationId: updateNotificationPreferences
      tags: [Notifications]
      security:
        - StellarSig: []
      description: Requires a valid `StellarSig` header (write endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: object
                  properties:
                    browserPushEnabled:
                      type: boolean
                      default: false
                    newFollowers:
                      type: boolean
                      default: true
                    newLikes:
                      type: boolean
                      default: true
                    newComments:
                      type: boolean
                      default: true
                    directMessages:
                      type: boolean
                      default: true
                    poolActivity:
                      type: boolean
                      default: true
                    governanceUpdates:
                      type: boolean
                      default: true
                subscription:
                  description: Push subscription used when browser push is enabled.
                  oneOf:
                    - type: string
                    - type: object
                      additionalProperties: true
      responses:
        "200":
          description: Preferences updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/notifications/inbox/{address}:
    get:
      summary: List a recipient's notifications
      operationId: listNotifications
      tags: [Notifications]
      security:
        - StellarSig: []
        - {}
      description: >-
        Follows of the recipient and likes/tips on their posts, newest first.
        Derived from public on-chain data, so no signature is required. Pages use
        an opaque composite `(created_at, id)` cursor; ids are stable
        (`follow:<follower>`, `like:<post_id>:<liker>`, `tip:<tx_hash>`).
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^G[A-Z2-7]{55}$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "`next_cursor` from the previous page."
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema:
                type: object
                required: [notifications, has_more, next_cursor]
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      required: [id, type, actor, created_at, read]
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [follow, like, tip]
                        actor:
                          type: string
                        post_id:
                          type: [integer, "null"]
                        amount:
                          type: [string, "null"]
                          description: Tip amount in the token's base units.
                        excerpt:
                          type: [string, "null"]
                        created_at:
                          type: string
                          format: date-time
                        read:
                          type: boolean
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/notifications/inbox/read-all:
    post:
      summary: Mark every notification as read
      operationId: markAllNotificationsRead
      tags: [Notifications]
      security:
        - StellarSig: []
      description: >-
        Requires a valid `StellarSig` header. Moves the caller's read watermark
        to now; every notification at or before it is reported as read.
      responses:
        "200":
          description: Watermark updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  read_through:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── State root ──────────────────────────────────────────────────────────────
  /api/state-root:
    get:
      summary: Get the computed state root for a ledger
      operationId: getStateRoot
      tags: [State Root]
      security:
        - StellarSig: []
        - {}
      parameters:
        - name: ledger
          in: query
          required: false
          schema:
            type: integer
          description: Ledger sequence to report on; defaults to the latest.
      responses:
        "200":
          description: State root entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger_sequence:
                    type: integer
                  state_root:
                    type: string
                  computed_at:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Messages ────────────────────────────────────────────────────────────────
  /api/messages:
    post:
      summary: Submit a direct message
      operationId: postMessage
      tags: [Messages]
      security:
        - StellarSig: []
      description: |
        Requires a valid `StellarSig` header (write endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientAddress, encryptedContent]
              properties:
                recipientAddress:
                  type: string
                encryptedContent:
                  type: string
      responses:
        "202":
          description: Message accepted for delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  from:
                    type: string
                  to:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    StellarSig:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Ed25519 signature over a canonical request string, sent as:

        ```
        Authorization: StellarSig <base64(JSON { address, timestamp, signature })>
        ```

        where `address` is the caller's Stellar public key (`G…`), `timestamp`
        is the signing time, and `signature` is the base64 Ed25519 signature.

        ### Canonical signing string

        The exact bytes that are SHA-256 hashed and signed are built by
        `buildAuthMessage()` in `packages/types/src/auth.ts`:

        ```
        v1:{METHOD}:{canonicalPath}:{address}:{timestamp}:{bodyHash}
        ```

        | Field           | Value |
        | --------------- | ----- |
        | `METHOD`        | Upper-cased HTTP method (`GET`, `POST`, …). |
        | `canonicalPath` | Result of `canonicalizeAuthPath(req.originalUrl)` — query string dropped, trailing slashes stripped, `/` kept as `/`. Includes the `/api` mount prefix. |
        | `address`       | Signer's Stellar public key (`G…`). |
        | `timestamp`     | Unix epoch **milliseconds** at signing time. Must be within the configured skew of server time. |
        | `bodyHash`      | Lowercase hex SHA-256 of the exact raw request body bytes; the empty string (`""` hash) when there is no body. |

        Both the verifier and every first-party client derive the message
        through that module, so the two sides cannot drift apart. See
        `docs/CONTRACT_API.md` and `docs/MIGRATION_AUTH_V1.md` for a
        self-contained reference implementation.

  parameters:
    address:
      name: address
      in: path
      required: true
      schema:
        type: string
      description: Stellar account address (G…).
    postId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Numeric post ID (as a string to support large integers).
    poolId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Pool symbol identifier.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of items to return.
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor for pagination.

  schemas:
    Profile:
      type: object
      required: [address, username, creator_token, updated_ledger]
      properties:
        address:
          type: string
        username:
          type: string
        creator_token:
          type: string
        updated_ledger:
          type: integer
        follower_count:
          type: integer
          description: Follower count included by profile search results.

    ProfileList:
      type: object
      required: [profiles, limit, cursor, next_cursor, has_more]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        limit:
          type: integer
        cursor:
          type: [string, "null"]
          description: The cursor token that was used to fetch this page.
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` when no more pages exist.
        has_more:
          type: boolean

    Post:
      type: object
      required: [id, author, deleted, tip_total, like_count, created_ledger]
      properties:
        id:
          type: string
          description: Numeric post ID serialised as a string.
        author:
          type: string
        deleted:
          type: boolean
        tip_total:
          type: string
          description: Cumulative tip amount serialised as a string.
        like_count:
          type: string
          description: Total likes serialised as a string.
        created_ledger:
          type: integer
        deleted_ledger:
          type: [integer, "null"]

    PostList:
      type: object
      required: [posts, limit, cursor, next_cursor, has_more]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        limit:
          type: integer
        cursor:
          type: [string, "null"]
          description: The cursor token that was used to fetch this page.
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` when no more pages exist.
        has_more:
          type: boolean

    FollowerList:
      type: object
      required: [address, followers, total, limit, cursor, next_cursor, has_more]
      properties:
        address:
          type: string
        followers:
          type: array
          items:
            type: string
        total:
          type: integer
        limit:
          type: integer
        cursor:
          type: [string, "null"]
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` when no more pages.
        has_more:
          type: boolean

    FollowingList:
      type: object
      required: [address, following, total, limit, cursor, next_cursor, has_more]
      properties:
        address:
          type: string
        following:
          type: array
          items:
            type: string
        total:
          type: integer
        limit:
          type: integer
        cursor:
          type: [string, "null"]
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` when no more pages.
        has_more:
          type: boolean

    Pool:
      type: object
      required: [pool_id, token, balance, admins, threshold, created_ledger, updated_ledger]
      properties:
        pool_id:
          type: string
        token:
          type: string
        balance:
          type: string
          description: Current balance serialised as a string.
        admins:
          type: array
          items:
            type: string
        threshold:
          type: integer
          description: Minimum number of admin signatures required for withdrawal.
        created_ledger:
          type: integer
        updated_ledger:
          type: integer

    ChainEvent:
      type: object
      required: [id, ledger_sequence, event_index, contract_id, topic, data]
      properties:
        id:
          type: string
          description: Surrogate row ID serialised as a string (supports large integers).
        ledger_sequence:
          type: integer
          description: Stellar ledger sequence in which this event was emitted.
        event_index:
          type: integer
          description: Position of this event within the ledger batch.
        contract_id:
          type: string
          description: Soroban contract that emitted the event.
        topic:
          type: array
          items:
            type: string
          description: Decoded topic values from the contract event.
        data:
          type: object
          additionalProperties: true
          description: Decoded JSONB event payload.
        processed_at:
          type: [string, "null"]
          format: date-time
          description: Timestamp when the event was projected into domain tables. `null` if not yet processed.

    EventList:
      type: object
      required: [events, limit, cursor, next_cursor, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ChainEvent"
        limit:
          type: integer
        cursor:
          type: [string, "null"]
          description: The cursor token that was used to fetch this page.
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` when no more pages exist.
        has_more:
          type: boolean

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code. Includes VALIDATION_ERROR, INVALID_AUTH_HEADER, INVALID_TIMESTAMP, EXPIRED_TIMESTAMP, INVALID_SIGNATURE, REPLAYED_SIGNATURE, NOT_FOUND, UNAUTHORIZED, FORBIDDEN, CONFLICT, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE, and SHUTTING_DOWN.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: array
          description: Optional additional context (e.g. validation errors).
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        requestId:
          type: string
          description: Request correlation ID for tracing.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

  responses:
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              details:
                - path: limit
                  message: Expected integer, received string
              requestId: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
              requestId: abc123
    Unauthorized:
      description: Signature verification failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid signature
              requestId: abc123
    Forbidden:
      description: Signature timestamp is invalid or expired, signature was replayed, or the caller is not allowed to perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: EXPIRED_TIMESTAMP
              message: Signature timestamp is outside the accepted window
              requestId: abc123
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
              requestId: abc123
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests
              retryAfterSeconds: 45
              requestId: abc123
