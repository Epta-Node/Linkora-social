<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="stellar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Starfield background texture accents -->
  <g opacity="0.85">
    <circle cx="16" cy="14" r="1" fill="#FFFFFF" opacity="0.9" />
    <circle cx="48" cy="18" r="1.2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="52" cy="46" r="1" fill="#FFFFFF" opacity="0.7" />
    <circle cx="20" cy="50" r="0.8" fill="#FFFFFF" opacity="0.9" />
    <path d="M 44 12 L 45 14 L 47 15 L 45 16 L 44 18 L 43 16 L 41 15 L 43 14 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M 18 40 L 19 41.5 L 20.5 42 L 19 42.5 L 18 44 L 17 42.5 L 15.5 42 L 17 41.5 Z" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Chain Link L Shape with Stellar Gradient -->
  <g filter="url(#glow)">
    <rect x="12" y="8" width="20" height="38" rx="10" fill="url(#stellar-grad)" />
    <rect x="17" y="13" width="10" height="28" rx="5" fill="#1E3A5F" opacity="0.95" />

    <rect x="18" y="34" width="38" height="20" rx="10" fill="url(#stellar-grad)" />
    <rect x="23" y="39" width="28" height="10" rx="5" fill="#1E3A5F" opacity="0.95" />

    <path d="M 22 34 A 4 4 0 0 1 26 30 H 32 A 4 4 0 0 1 36 34" stroke="url(#stellar-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
